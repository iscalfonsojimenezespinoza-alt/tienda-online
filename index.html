<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Catálogo Principal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            color: #0f172a;
            margin-bottom: 5px;
        }
        /* Contenedor en cuadrícula para los productos */
        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        /* Tarjeta individual de cada producto */
        .tarjeta-producto {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tarjeta-producto img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
        }
        .precio {
            font-size: 1.25rem;
            color: #10b981;
            font-weight: bold;
            margin: 10px 0;
        }
        /* Botón para ver el detalle */
        .btn-comprar {
            background-color: #3b82f6;
            color: white;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-comprar:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛍️ TechStore Online</h1>
        <p>Explora nuestros productos estrella y descubre sus características.</p>
    </header>

    <main class="catalogo">
        <!-- Producto 1 -->
        <div class="tarjeta-producto">
            <div>
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80" alt="Audífonos">
                <h3>Audífonos Inalámbricos</h3>
                <p class="precio">$1,200 MXN</p>
            </div>
            <!-- Enlace que dirige a la página detallada del producto 1 -->
            <a href="producto1.html" class="btn-comprar">Ver Detalles</a>
        </div>

        <!-- Producto 2 -->
        <div class="tarjeta-producto">
            <div>
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80" alt="Reloj Inteligente">
                <h3>Smartwatch Pro</h3>
                <p class="precio">$2,500 MXN</p>
            </div>
            <!-- Enlace que dirige a la página detallada del producto 2 -->
            <a href="producto2.html" class="btn-comprar">Ver Detalles</a>
        </div>

        <!-- Producto 3 -->
        <div class="tarjeta-producto">
            <div>
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=400&q=80" alt="Cámara">
                <h3>Cámara Vintage</h3>
                <p class="precio">$4,800 MXN</p>
            </div>
            <!-- Enlace que dirige a la página detallada del producto 3 -->
            <a href="producto3.html" class="btn-comprar">Ver Detalles</a>
        </div>
    </main>

</body>
</html>
